<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#060b1c">
<title>🎄 Merry Christmas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Palatino Linotype", Georgia, "STSong", "SimSun", "Microsoft YaHei", serif;
    background:
      radial-gradient(130% 100% at 50% -10%, #1a2c5e 0%, #101d42 32%, #0a1330 58%, #050a1c 82%, #030613 100%);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { position: fixed; inset: 0; display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }

  /* 暗角,营造舞台感 */
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(115% 90% at 50% 42%, transparent 55%, rgba(2,5,15,.62) 100%);
  }

  /* 地面:极光雪原 */
  .ground {
    position: fixed; left: 50%; bottom: -16vh; transform: translateX(-50%);
    width: 150vw; height: 36vh; border-radius: 50%; pointer-events: none;
    background:
      radial-gradient(closest-side, rgba(120,190,255,.13), transparent 70%),
      radial-gradient(closest-side at 50% 40%, rgba(255,255,255,.06), transparent 62%);
  }

  /* ===== 标题区 ===== */
  .ui {
    position: fixed; inset: 0; pointer-events: none; z-index: 4;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 5.2vh; text-align: center;
  }
  h1 {
    font-size: clamp(32px, 6.2vw, 66px);
    font-weight: 600; letter-spacing: .08em;
    background: linear-gradient(100deg, #7a4f00 0%, #ffe9a8 22%, #fffdf4 38%, #ffd76e 52%, #9a6b00 72%, #ffe9a8 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 5.5s linear infinite;
    filter: drop-shadow(0 0 22px rgba(255,200,90,.38)) drop-shadow(0 2px 10px rgba(0,0,0,.5));
  }
  @keyframes shine { to { background-position: 220% 0; } }
  .sub {
    margin-top: 12px;
    font-size: clamp(14px, 2.2vw, 21px); letter-spacing: .8em; text-indent: .8em;
    color: #e8f1ff;
    text-shadow: 0 0 14px rgba(150,200,255,.75), 0 0 40px rgba(120,170,255,.4);
  }
  .orn { margin-top: 12px; font-size: 13px; letter-spacing: .7em; text-indent: .7em; color: rgba(255,215,130,.65); }
  .count {
    margin-top: 16px; padding: 8px 22px; border-radius: 999px;
    font-size: 13px; letter-spacing: .14em; color: #ffe9b8;
    background: rgba(255,220,140,.07);
    border: 1px solid rgba(255,215,130,.35);
    box-shadow: 0 0 24px rgba(255,200,90,.12) inset;
    backdrop-filter: blur(6px);
  }

  /* ===== 按钮 ===== */
  .btns { position: fixed; top: 16px; right: 16px; z-index: 9; display: flex; gap: 10px; }
  .chipbtn {
    padding: 8px 16px; border-radius: 999px; cursor: pointer;
    font-size: 13px; letter-spacing: .06em; color: #ffe9b8;
    font-family: inherit;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.16);
    backdrop-filter: blur(10px);
    transition: transform .15s, border-color .3s, box-shadow .3s;
  }
  .chipbtn:hover {
    transform: scale(1.05);
    border-color: rgba(255,215,130,.55);
    box-shadow: 0 0 18px rgba(255,200,90,.18);
  }
  .chipbtn:active { transform: scale(.96); }

  .hint {
    position: fixed; bottom: 4.5vh; left: 0; right: 0; z-index: 4;
    text-align: center; color: rgba(230,240,255,.5);
    font-size: 12.5px; letter-spacing: .16em;
    animation: hintfade 1.4s ease 9s forwards;
  }
  @keyframes hintfade { to { opacity: 0; } }

  .credit {
    position: fixed; bottom: 14px; left: 16px; z-index: 4;
    color: rgba(255,255,255,.28); font-size: 11px; letter-spacing: .18em;
  }

  /* ===== 祝福贺卡 ===== */
  .cardwrap {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center;
    background: rgba(3,6,18,.6); backdrop-filter: blur(8px);
  }
  .cardwrap.show { display: flex; animation: fadein .35s ease; }
  @keyframes fadein { from { opacity: 0; } }
  .card {
    width: min(86vw, 420px); padding: 42px 34px 30px;
    text-align: center; position: relative;
    background: linear-gradient(165deg, rgba(30,44,86,.92), rgba(14,22,48,.94));
    border: 1px solid rgba(255,215,130,.45);
    border-radius: 18px;
    box-shadow: 0 24px 80px rgba(0,0,0,.55), 0 0 60px rgba(255,200,90,.1) inset;
    animation: cardin .45s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes cardin { from { transform: translateY(26px) scale(.94); opacity: 0; } }
  .card-star { font-size: 22px; color: #ffd76e; text-shadow: 0 0 18px rgba(255,210,110,.8); }
  .card h2 {
    margin: 10px 0 16px; font-size: 26px; letter-spacing: .3em; text-indent: .3em;
    background: linear-gradient(100deg, #ffe9a8, #fffdf4 45%, #ffd76e);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .card p { color: #d7e4ff; font-size: 14.5px; line-height: 2.05; letter-spacing: .1em; }
  .card .en { margin-top: 12px; color: rgba(255,225,160,.8); font-size: 12.5px; letter-spacing: .22em; font-style: italic; }
  .card-actions { margin-top: 24px; display: flex; gap: 10px; justify-content: center; }
  .card-x {
    position: absolute; top: 10px; right: 14px; cursor: pointer;
    color: rgba(255,255,255,.5); font-size: 18px; background: none; border: none; font-family: inherit;
  }
  .card-x:hover { color: #ffe9b8; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="ground"></div>
<div class="vignette"></div>

<div class="ui">
  <h1>🎄 Merry Christmas 🎄</h1>
  <div class="sub">圣诞快乐</div>
  <div class="orn">✦ ─── ❄ ─── ✦</div>
  <div class="count" id="count"></div>
</div>

<div class="btns">
  <button class="chipbtn" id="cardBtn">💌 祝福卡</button>
  <button class="chipbtn" id="music">🔔 铃声</button>
</div>

<div class="hint">🖱️ 拖动旋转 · 单击烟花 · 双击烟花秀 · 🔔 音乐 · 💌 祝福卡</div>
<div class="credit">✦ MERRY CHRISTMAS · 2026 ✦</div>

<!-- 祝福贺卡 -->
<div class="cardwrap" id="cardwrap">
  <div class="card">
    <button class="card-x" id="cardX">✕</button>
    <div class="card-star">✦ ❄ ✦</div>
    <h2>圣诞快乐</h2>
    <p>愿你的圣诞有雪花、有灯火、<br>有热可可,也有想念的人;<br>愿所有温柔,都如约而至。</p>
    <p class="en">— Merry Christmas &amp; Happy New Year —</p>
    <div class="card-actions">
      <button class="chipbtn" id="copyBtn">📋 复制祝福语</button>
      <button class="chipbtn" id="cardClose">留下</button>
    </div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, U = 0, CX = 0, CY = 0, px0 = 0, py0 = 0; // px0/py0 鼠标视差

  function resize() {
    const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    U = Math.min(W, H) * 0.42; CX = W / 2; CY = H * 0.565;
  }
  addEventListener('resize', resize); resize();

  /* ============ 高分辨率发光贴图 ============ */
  const SPR = [];
  for (let h = 0; h < 36; h++) {
    const s = document.createElement('canvas'); s.width = s.height = 128;
    const g = s.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(.18, `hsla(${h * 10},100%,80%,.95)`);
    gr.addColorStop(.42, `hsla(${h * 10},95%,62%,.55)`);
    gr.addColorStop(1, `hsla(${h * 10},95%,55%,0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    SPR.push(s);
  }
  const spr = hue => SPR[Math.round(((hue % 360 + 360) % 360) / 10) % 36];

  /* ============ 圣诞树粒子 ============ */
  const PTS = [];
  const LAY = 46, PER = 16, GA = 2.39996323;
  for (let i = 0; i < LAY; i++) {
    const y = i / (LAY - 1);
    const r = Math.pow(y, .85) * .32;
    for (let j = 0; j < PER; j++) {
      PTS.push({
        a: GA * i + j / PER * Math.PI * 2,
        y, r: r * (.85 + Math.random() * .15),
        ph: Math.random() * 6.283, sp: .8 + Math.random() * 1.6,
        off: Math.random() * 60,
        warm: Math.random() < .085
      });
    }
  }

  /* 闪光星芒(随树旋转的挂点) */
  const GLINTS = Array.from({ length: 13 }, () => ({
    y: .12 + Math.random() * .8, da: Math.random() * 6.283,
    ph: Math.random() * 6.283, sp: .9 + Math.random() * 1.3
  }));
  /* 地面雪地闪光 */
  const GGLINTS = Array.from({ length: 7 }, (_, k) => ({
    a: k / 7 * 6.283 + Math.random(), rr: .35 + Math.random() * .5,
    ph: Math.random() * 6.283, sp: .7 + Math.random()
  }));

  /* 光环 */
  const RINGS = [
    { R: .47, sq: .26, cy: -.05, sp: .45,  hue: 44 },
    { R: .40, sq: .33, cy: -.15, sp: -.32, hue: 200 }
  ];

  /* 雪花 / 星星 / 光斑 */
  const SNOW = Array.from({ length: 130 }, () => ({
    x: Math.random(), y: Math.random(), r: .6 + Math.random() * 2,
    v: .25 + Math.random() * .85, d: Math.random() * 6.283, a: .3 + Math.random() * .55
  }));
  const STARS = Array.from({ length: 90 }, () => ({
    x: Math.random(), y: Math.random() * .62, r: .4 + Math.random() * 1.2,
    ph: Math.random() * 6.283, sp: .4 + Math.random() * 1.4
  }));
  const BOKEH = Array.from({ length: 8 }, () => ({
    x: Math.random(), y: .12 + Math.random() * .6, r: 26 + Math.random() * 60,
    hue: 190 + Math.random() * 140, ph: Math.random() * 6.283, sp: .1 + Math.random() * .2
  }));
  let METEORS = [], nextMeteor = 4;

  /* ============ 烟花系统 ============ */
  const FX = [], SHOCK = [];
  let flash = 0, nextAuto = 9;

  function explode(x, y, small = false, grand = false) {
    const type = ['ring', 'heart', 'willow', 'burst'][Math.floor(Math.random() * 4)];
    const baseHue = Math.random() * 360;
    const n = small ? 26 : (grand ? 92 : 58);
    for (let i = 0; i < n; i++) {
      let a, v, hue = baseHue + Math.random() * 36 - 18, g = .045, drag = .985, glt = false;
      const c = n / (Math.PI * 2);
      if (type === 'ring')      { a = i / c; v = 2.6 + Math.random() * .4; }
      else if (type === 'burst'){ a = Math.random() * 6.283; v = Math.sqrt(Math.random()) * 4.6; }
      else if (type === 'heart'){
        const tt = i / c;
        const hx = 16 * Math.pow(Math.sin(tt), 3);
        const hy = -(13 * Math.cos(tt) - 5 * Math.cos(2 * tt) - 2 * Math.cos(3 * tt) - Math.cos(4 * tt));
        const L = Math.hypot(hx, hy) || 1; a = Math.atan2(hy, hx); v = .22 * L; hue = 350 + Math.random() * 20; g = .05;
      }
      else { a = Math.random() * 6.283; v = 1 + Math.random() * 3; hue = 40 + Math.random() * 14; g = .085; drag = .988; glt = Math.random() < .8; }
      FX.push({
        x, y, px: x, py: y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - (small ? .6 : 1.1),
        life: 1, decay: .008 + Math.random() * .012,
        hue, r: (small ? 1.4 : 2) + Math.random() * 2.6,
        g, drag, glt: glt || Math.random() < .25
      });
    }
    SHOCK.push({ x, y, r: 3, v: small ? 4 : 6.5, a: small ? .3 : .5 });
    flash = Math.min(.5, flash + (grand ? .2 : small ? .05 : .11));
  }
  function grandShow(x, y) {
    explode(x, y, false, true);
    const offs = [[-U * .6, -U * .3], [U * .55, -U * .25], [-U * .4, U * .1], [U * .45, U * .12]];
    offs.forEach((o, i) => setTimeout(() => explode(x + o[0], y + o[1], false, false), 130 * (i + 1)));
  }

  /* ============ 交互 ============ */
  let rot = 0, rotV = .0045, drag = null, lastClick = 0;
  cv.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY, moved: 0 };
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    px0 = (e.clientX / W - .5) * 2; py0 = (e.clientY / H - .5) * 2;
    if (!drag) return;
    const dx = e.clientX - drag.x;
    drag.x = e.clientX; drag.y = e.clientY;
    drag.moved += Math.abs(dx);
    rotV = dx * .005; rot += dx * .005;
  });
  addEventListener('pointerup', e => {
    if (drag && drag.moved < 8) {
      const now = performance.now();
      if (now - lastClick < 350) grandShow(e.clientX, e.clientY);
      else explode(e.clientX, e.clientY);
      lastClick = now;
    }
    drag = null;
  });

  /* ============ 主循环 ============ */
  const F = 620;
  let t = 0;
  function frame() {
    t += 1 / 60;
    ctx.clearRect(0, 0, W, H);

    /* --- 深空星云(视差反向) --- */
    ctx.globalCompositeOperation = 'lighter';
    const nb = [[.24, .3, 190, U * 1.15], [.76, .22, 265, U * 1.0], [.5, .52, 210, U * 1.3]];
    for (let i = 0; i < nb.length; i++) {
      const [bx, by, hue, rr] = nb[i];
      const nx = bx * W + Math.sin(t * .07 + i * 2.1) * 40 - px0 * 14;
      const ny = by * H + Math.cos(t * .09 + i * 1.7) * 26 - py0 * 10;
      const g = ctx.createRadialGradient(nx, ny, 0, nx, ny, rr);
      g.addColorStop(0, `hsla(${hue + Math.sin(t * .05 + i) * 25},70%,55%,.085)`);
      g.addColorStop(1, 'hsla(0,0%,0%,0)');
      ctx.fillStyle = g;
      ctx.fillRect(nx - rr, ny - rr, rr * 2, rr * 2);
    }

    /* --- 极光飘带 --- */
    for (let k = 0; k < 3; k++) {
      const hue = (150 + k * 45 + t * 4) % 360;
      const yBase = H * (.14 + k * .09) - py0 * 16;
      const gg = ctx.createLinearGradient(0, 0, W, 0);
      gg.addColorStop(0, `hsla(${hue},85%,60%,0)`);
      gg.addColorStop(.28, `hsla(${hue},85%,62%,.05)`);
      gg.addColorStop(.55, `hsla(${hue + 30},85%,64%,.065)`);
      gg.addColorStop(.8, `hsla(${hue + 55},85%,60%,.05)`);
      gg.addColorStop(1, `hsla(${hue + 70},85%,60%,0)`);
      ctx.strokeStyle = gg;
      ctx.lineWidth = U * .4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-60, yBase + Math.sin(t * .25 + k * 1.4) * 34);
      ctx.bezierCurveTo(
        W * .3, yBase + Math.sin(t * .3 + k) * 52 + 30,
        W * .7, yBase - Math.cos(t * .22 + k * 2) * 56 - 20,
        W + 60, yBase + Math.sin(t * .28 + k * 3) * 38
      );
      ctx.stroke();
    }

    /* --- 星星 / 光斑 / 流星(视差反向) --- */
    ctx.globalCompositeOperation = 'source-over';
    const ox = -px0 * 10, oy = -py0 * 7;
    for (const s of STARS) {
      const al = .2 + .4 * (.5 + .5 * Math.sin(t * s.sp + s.ph));
      ctx.fillStyle = `rgba(255,255,255,${al})`;
      ctx.beginPath(); ctx.arc(s.x * W + ox, s.y * H + oy, s.r, 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const b of BOKEH) {
      const bx = b.x * W + Math.sin(t * b.sp * 3 + b.ph) * 36 + ox;
      const by = b.y * H + Math.cos(t * b.sp * 2.4 + b.ph) * 24 + oy;
      const size = b.r * 2;
      ctx.globalAlpha = .05 + .025 * Math.sin(t * .8 + b.ph);
      ctx.drawImage(spr(b.hue + t * 6), bx - size / 2, by - size / 2, size, size);
    }
    ctx.globalAlpha = 1;
    /* 流星 */
    if (t > nextMeteor && METEORS.length < 2) {
      METEORS.push({
        x: W * (.15 + Math.random() * .8), y: H * (.04 + Math.random() * .2),
        vx: -(6 + Math.random() * 6) * (Math.random() < .5 ? 1 : -1),
        vy: 3 + Math.random() * 2.4, life: 1
      });
      nextMeteor = t + 3.5 + Math.random() * 5;
    }
    for (let i = METEORS.length - 1; i >= 0; i--) {
      const m = METEORS[i];
      m.x += m.vx; m.y += m.vy; m.life -= .011;
      if (m.life <= 0) { METEORS.splice(i, 1); continue; }
      const tx = m.x - m.vx * 10, ty = m.y - m.vy * 10;
      const lg = ctx.createLinearGradient(m.x, m.y, tx, ty);
      lg.addColorStop(0, `rgba(255,255,255,${.85 * m.life})`);
      lg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = lg; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
      const size = 10 * m.life;
      ctx.globalAlpha = m.life;
      ctx.drawImage(spr(50), m.x - size / 2, m.y - size / 2, size, size);
      ctx.globalAlpha = 1;
    }

    /* --- 远景雪 --- */
    ctx.globalCompositeOperation = 'source-over';
    for (const f of SNOW) {
      f.y += f.v * .0028; f.x += Math.sin(t * .8 + f.d) * .0004;
      if (f.y > 1.05) { f.y = -.05; f.x = Math.random(); }
      ctx.fillStyle = `rgba(255,255,255,${f.a * .75})`;
      ctx.beginPath(); ctx.arc(f.x * W, f.y * H, f.r, 0, 6.283); ctx.fill();
    }

    /* --- 树(视差同向,轻微镜头感) --- */
    ctx.globalCompositeOperation = 'lighter';
    const CXp = CX + px0 * 14, CYp = CY + py0 * 9;
    if (!drag) rotV += (.0045 - rotV) * .02;
    rot += rotV;

    const bg2 = ctx.createRadialGradient(CXp, CYp + U * .5, 0, CXp, CYp + U * .5, U * .6);
    bg2.addColorStop(0, 'rgba(90,160,255,.15)');
    bg2.addColorStop(.55, 'rgba(150,110,255,.05)');
    bg2.addColorStop(1, 'rgba(90,160,255,0)');
    ctx.fillStyle = bg2;
    ctx.fillRect(CXp - U * .65, CYp, U * 1.3, U * 1.15);

    for (const p of PTS) {
      const ang = p.a + rot;
      const X = Math.sin(ang) * p.r * U;
      const Z = Math.cos(ang) * p.r * U;
      const sway = Math.sin(t * .9 + p.y * 5 + p.a * .3) * U * .02 * p.y
                 + Math.sin(t * 1.7 + p.y * 9) * U * .006 * p.y;
      const pr = F / (F + Z);
      const sx = CXp + X * pr + sway;
      const sy = CYp + (p.y - .5) * U * pr;
      const tw = .55 + .45 * Math.sin(t * p.sp * 2 + p.ph);
      let hue, alpha, sz;
      if (p.warm) { hue = 40 + 14 * Math.sin(t * .8 + p.ph); alpha = .6 + .4 * tw; sz = 2.7 + 2.3 * tw; }
      else { hue = (t * 16 + p.y * 150 + p.off) % 360; alpha = .32 + .5 * tw; sz = 1.5 + 1.7 * tw; }
      const s = spr(hue);
      const size = sz * (U / 430) * pr * 2;
      ctx.globalAlpha = Math.min(1, alpha * pr * .3);
      const halo = size * 2.8;
      ctx.drawImage(s, sx - halo / 2, sy - halo / 2, halo, halo);
      ctx.globalAlpha = Math.min(1, alpha * pr);
      ctx.drawImage(s, sx - size / 2, sy - size / 2, size, size);
    }

    /* 挂点星芒闪光 */
    ctx.lineCap = 'round';
    for (const gl of GLINTS) {
      const fl = Math.max(0, Math.sin(t * gl.sp * 2 + gl.ph));
      if (fl < .55) continue;
      const f2 = (fl - .55) / .45;
      const ang = gl.da + rot;
      const pr = F / (F + Math.cos(ang) * Math.pow(gl.y, .85) * .32 * U);
      const sx = CXp + Math.sin(ang) * Math.pow(gl.y, .85) * .32 * U * pr
               + Math.sin(t * .9 + gl.y * 5) * U * .02 * gl.y;
      const sy = CYp + (gl.y - .5) * U * pr;
      const len = f2 * U * .05;
      ctx.globalAlpha = f2;
      ctx.strokeStyle = 'rgba(255,240,210,.95)';
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(sx - len, sy); ctx.lineTo(sx + len, sy);
      ctx.moveTo(sx, sy - len); ctx.lineTo(sx, sy + len);
      ctx.stroke();
      const size = f2 * 8;
      ctx.drawImage(spr(50), sx - size / 2, sy - size / 2, size, size);
    }
    ctx.globalAlpha = 1;

    /* 光环(金色能量环) */
    for (const R of RINGS) {
      const RR = R.R * U, cy = CYp + R.cy * U;
      const al = .32 + .16 * Math.sin(t * 1.1 + R.cy * 10);
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(CXp, cy, RR, RR * R.sq, 0, 0, 6.283);
      const rg = ctx.createLinearGradient(CXp - RR, cy, CXp + RR, cy);
      const h2 = (R.hue + t * 10) % 360;
      rg.addColorStop(0, `hsla(${h2},90%,70%,0)`);
      rg.addColorStop(.22, `hsla(${h2},90%,72%,${al})`);
      rg.addColorStop(.5, `hsla(${h2},90%,80%,${al * .45})`);
      rg.addColorStop(.78, `hsla(${h2},90%,72%,${al})`);
      rg.addColorStop(1, `hsla(${h2},90%,70%,0)`);
      ctx.strokeStyle = rg;
      ctx.lineWidth = 1.3;
      ctx.setLineDash([U * .07, U * .05]);
      ctx.lineDashOffset = -t * U * .13 * Math.sign(R.sp);
      ctx.stroke();
      ctx.setLineDash([]);
      for (let k = 0; k < 11; k++) {
        const th = t * R.sp + k / 11 * 6.283;
        const dx = Math.cos(th) * RR, dy = Math.sin(th) * RR * R.sq;
        const size = 5.5 * (U / 430) * (1 + .4 * Math.sin(t * 3 + k * 2));
        ctx.globalAlpha = .5 + .4 * Math.sin(t * 2.4 + k * 1.7);
        ctx.drawImage(spr(R.hue), CXp + dx - size / 2, cy + dy - size / 2, size, size);
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    /* 树顶大星 */
    const stx = CXp, sty = CYp - U * .53;
    const pulse = .7 + .3 * Math.sin(t * 3.2);
    const halo = ctx.createRadialGradient(stx, sty, 0, stx, sty, U * .18 * pulse);
    halo.addColorStop(0, 'rgba(255,242,200,.95)');
    halo.addColorStop(.28, 'rgba(255,205,90,.4)');
    halo.addColorStop(.6, 'rgba(255,180,70,.12)');
    halo.addColorStop(1, 'rgba(255,180,60,0)');
    ctx.fillStyle = halo;
    const hw = U * .19 * pulse;
    ctx.fillRect(stx - hw, sty - hw, hw * 2, hw * 2);
    ctx.save();
    ctx.translate(stx, sty); ctx.rotate(t * .4);
    ctx.strokeStyle = 'rgba(255,235,170,.95)';
    ctx.lineWidth = 2 * (U / 430);
    ctx.shadowColor = '#ffd76e'; ctx.shadowBlur = 20;
    for (let k = 0; k < 6; k++) {
      ctx.rotate(Math.PI / 3);
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(0, -U * .055 * pulse * (k % 2 ? .62 : 1));
      ctx.stroke();
    }
    ctx.restore();
    for (let k = 0; k < 9; k++) {
      const a2 = t * 1.5 + k * 6.283 / 9;
      const rr = U * .055 * (1 + .3 * Math.sin(t * 2 + k));
      const pxx = stx + Math.cos(a2) * rr * 1.5, pyy = sty + Math.sin(a2) * rr * .65;
      const size = 4 * (U / 430) * 2;
      ctx.globalAlpha = .55 + .45 * Math.sin(t * 3 + k);
      ctx.drawImage(spr(46), pxx - size / 2, pyy - size / 2, size, size);
    }
    ctx.globalAlpha = 1;

    /* 地面闪光 */
    for (const g of GGLINTS) {
      const fl = Math.max(0, Math.sin(t * g.sp + g.ph));
      if (fl < .7) continue;
      const f2 = (fl - .7) / .3;
      const gx = CXp + Math.cos(g.a) * U * g.rr;
      const gy = CYp + U * .52 + Math.sin(g.a) * U * .1;
      ctx.globalAlpha = f2 * .9;
      const size = f2 * 9;
      ctx.drawImage(spr(52), gx - size / 2, gy - size / 2, size, size);
    }
    ctx.globalAlpha = 1;

    /* --- 烟花 --- */
    if (t > nextAuto) {
      explode(W * (.2 + Math.random() * .6), H * (.12 + Math.random() * .3), true);
      nextAuto = t + 7 + Math.random() * 8;
    }
    for (let i = SHOCK.length - 1; i >= 0; i--) {
      const s = SHOCK[i];
      s.r += s.v; s.v *= .94; s.a -= .016;
      if (s.a <= 0) { SHOCK.splice(i, 1); continue; }
      ctx.strokeStyle = `hsla(${s.hue || 45},90%,75%,${s.a})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.stroke();
    }
    for (let i = FX.length - 1; i >= 0; i--) {
      const q = FX[i];
      q.px = q.x; q.py = q.y;
      q.vx *= q.drag; q.vy = q.vy * q.drag + q.g;
      q.x += q.vx; q.y += q.vy;
      q.life -= q.decay;
      if (q.life <= 0) { FX.splice(i, 1); continue; }
      let al = q.life;
      if (q.glt && q.life < .55) al *= Math.sin(q.life * 60) > 0 ? 1 : .2;
      ctx.strokeStyle = `hsla(${q.hue},95%,72%,${al * .85})`;
      ctx.lineWidth = q.r * .9;
      ctx.beginPath(); ctx.moveTo(q.px, q.py); ctx.lineTo(q.x, q.y); ctx.stroke();
      const s = spr(q.hue);
      const size = (q.r + q.life * 2.4) * (U / 430) * 2.6;
      ctx.globalAlpha = al;
      ctx.drawImage(s, q.x - size / 2, q.y - size / 2, size, size);
    }
    ctx.globalAlpha = 1;
    if (flash > .01) {
      ctx.fillStyle = `rgba(255,240,220,${flash * .09})`;
      ctx.fillRect(0, 0, W, H);
      flash *= .86;
    }

    /* --- 近景大雪(最前,缓慢) --- */
    ctx.globalCompositeOperation = 'source-over';
    for (const f of SNOW) {
      if (f.r < 1.9) continue;
      ctx.fillStyle = `rgba(255,255,255,${f.a * .9})`;
      ctx.beginPath(); ctx.arc(f.x * W + px0 * 20, f.y * H + py0 * 14, f.r * 1.6, 0, 6.283); ctx.fill();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ============ 倒计时 ============ */
  const countEl = document.getElementById('count');
  (function updCount() {
    const now = new Date();
    let tgt = new Date(now.getFullYear(), 11, 25);
    if (now.getMonth() === 11 && now.getDate() > 25) tgt = new Date(now.getFullYear() + 1, 11, 25);
    const d = Math.ceil((tgt - now) / 864e5);
    countEl.textContent = d > 0 ? `⏳ 距离圣诞节还有 ${d} 天` : '🎉 今天就是圣诞节!';
    setInterval(updCount, 6e4);
  })();

  /* ============ 音乐:八音盒版《铃儿响叮当》 ============ */
  const FREQ = { G4:392, A4:440, B4:493.88, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99 };
  const MEL = [
    ['E5',.5],['E5',.5],['E5',1], ['E5',.5],['E5',.5],['E5',1],
    ['E5',.5],['G5',.5],['C5',.75],['D5',.25],['E5',2],
    ['F5',.5],['F5',.5],['F5',.75],['F5',.25],['F5',.5],['E5',.5],['E5',.5],['E5',.25],['E5',.25],
    ['E5',.5],['D5',.5],['D5',.5],['E5',.5],['D5',1.5],['G5',.5],
    ['C5',.5],['C5',.5],['C5',.75],['C5',.25],['C5',.5],['B4',.5],['B4',.5],['B4',.25],['B4',.25],
    ['B4',.5],['D5',.5],['D5',.5],['B4',.5],['A4',.5],['A4',.5],['B4',.75],['C5',.25],
    ['D5',1],['D5',.5],['B4',.5],['G4',.5],['A4',1.5],['B4',.5],
    ['C5',.5],['C5',.5],['C5',.75],['C5',.25],['C5',.5],['B4',.5],['B4',.5],['B4',.25],['B4',.25],
    ['B4',.5],['D5',.5],['D5',.5],['B4',.5],['A4',.5],['A4',.5],['B4',.75],['C5',.25],
    ['D5',1],['D5',.5],['B4',.5],['G4',.5],['C5',1.5],['C5',.5],['C5',1]
  ];
  const btn = document.getElementById('music');
  let actx = null, master = null, on = false, timer = null, ni = 0, nt = 0;

  function initAudio() {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = .85;
    master.connect(actx.destination);
    /* 回声链 → 八音盒质感 */
    const dly = actx.createDelay(1); dly.delayTime.value = .27;
    const fb = actx.createGain(); fb.gain.value = .3;
    const wet = actx.createGain(); wet.gain.value = .2;
    master.connect(dly); dly.connect(fb); fb.connect(dly);
    dly.connect(wet); wet.connect(actx.destination);
  }
  function playNote(f, at, dur) {
    const g = actx.createGain();
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(.15, at + .015);
    g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    const o = actx.createOscillator();
    o.type = 'triangle'; o.frequency.value = f;
    o.connect(g);
    const o2 = actx.createOscillator(), g2 = actx.createGain();
    o2.type = 'sine'; o2.frequency.value = f * 2; g2.gain.value = .3;
    o2.connect(g2); g2.connect(g);
    g.connect(master);
    o.start(at); o.stop(at + dur + .05);
    o2.start(at); o2.stop(at + dur + .05);
  }
  function tick() {
    if (!on) return;
    while (nt < actx.currentTime + .6) {
      const [n, b] = MEL[ni];
      playNote(FREQ[n], nt, b * .38);
      nt += b * .38; ni = (ni + 1) % MEL.length;
    }
    timer = setTimeout(tick, 180);
  }
  btn.addEventListener('click', () => {
    if (!actx) {
      try { initAudio(); } catch (e) { btn.textContent = '🔇 不支持'; return; }
    }
    if (on) {
      clearTimeout(timer); actx.suspend(); on = false;
      btn.textContent = '🔔 铃声';
    } else {
      actx.resume(); ni = 0; nt = actx.currentTime + .1; on = true;
      btn.textContent = '🔔 播放中 ♪';
      tick();
    }
  });

  /* ============ 祝福贺卡 ============ */
  const wrap = document.getElementById('cardwrap');
  document.getElementById('cardBtn').addEventListener('click', () => wrap.classList.add('show'));
  document.getElementById('cardX').addEventListener('click', () => wrap.classList.remove('show'));
  document.getElementById('cardClose').addEventListener('click', () => wrap.classList.remove('show'));
  wrap.addEventListener('click', e => { if (e.target === wrap) wrap.classList.remove('show'); });
  document.getElementById('copyBtn').addEventListener('click', function () {
    const txt = '🎄圣诞快乐!愿你的圣诞有雪花、有灯火、有热可可,也有想念的人;愿所有温柔,都如约而至。✨ Merry Christmas & Happy New Year!';
    const done = () => { this.textContent = '✅ 已复制'; setTimeout(() => this.textContent = '📋 复制祝福语', 1600); };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done).catch(done);
    else done();
  });
})();
</script>
